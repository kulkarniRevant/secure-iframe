<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiceNow iFrame POC</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        h1 {
            color: #0366d6;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background: #e8f5e9;
        }

        .message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            background: #f3f2f1;
            white-space: pre-wrap;
            word-break: break-word;
        }

        button {
            margin-top: 15px;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            background: #0070d2;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #005fb2;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ServiceNow iFrame POC</h1>

    <div class="status">
        Status: <span id="status">Loading...</span>
    </div>

    <div class="message">
        <strong>Last Message Received:</strong>
        <div id="message">None</div>
    </div>

    <button onclick="sendCustomMessage()">
        Send STATUS_UPDATE
    </button>

</div>

<script>

    console.log('iFrame loaded');

    // Notify ServiceNow that the iframe is ready
    function notifyReady() {

        const message = {
            type: "IFRAME_READY",
            timestamp: new Date().toISOString()
        };

        console.log("Sending IFRAME_READY", message);

        window.parent.postMessage(message, "*");

        document.getElementById("status").innerText =
            "IFRAME_READY sent";
    }

    // Listen for messages from ServiceNow
    window.addEventListener("message", function(event) {

        console.log("Received message:", event);

        document.getElementById("message").innerText =
            JSON.stringify(event.data, null, 2);

        document.getElementById("status").innerText =
            "Message received";

        // If ServiceNow sends AUTH_TOKEN
        if(event.data && event.data.type === "AUTH_TOKEN") {

            console.log("Received token:", event.data.token);

            document.getElementById("status").innerText =
                "AUTH_TOKEN received";

            // Send acknowledgement back
            window.parent.postMessage({
                type: "STATUS_UPDATE",
                status: "authenticated",
                receivedAt: new Date().toISOString()
            }, "*");
        }
    });

    // Manual test button
    function sendCustomMessage() {

        const payload = {
            type: "STATUS_UPDATE",
            status: "button_clicked",
            timestamp: new Date().toISOString()
        };

        console.log("Sending:", payload);

        window.parent.postMessage(payload, "*");
    }

    // Send ready event after page loads
    window.onload = function() {
        notifyReady();
    };

</script>

</body>
</html>
